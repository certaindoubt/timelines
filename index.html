<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeless &mdash; timelines of everything</title>
  <meta name="description" content="Timeless: beautifully curated timelines on science, technology, history, culture and more. A new timeline every day." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9201;</text></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">&#9201;</span>
      <h1>Time<span>less</span></h1>
    </div>
    <nav>
      <a href="index.html">Timelines</a>
      <span>New one every day</span>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Every thing has a timeline.</h2>
      <p>From quantum computing to the history of film: explorable timelines with primary-source references. Refreshed daily.</p>
    </section>

    <section class="controls">
      <div class="view-toggle" id="viewToggle" role="group" aria-label="View mode">
        <button class="view-btn active" data-view="popular">Top 10</button>
        <button class="view-btn" data-view="random">Random</button>
        <button class="view-btn" data-view="all">All</button>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="Search timelines&hellip;" autocomplete="off" />
      </div>
      <div class="chips" id="chips"></div>
      <div class="count" id="count"></div>
    </section>

    <section class="grid" id="grid"></section>
  </main>

  <footer>
    <p><span id="total"></span> &middot; Curated by hand, expanded daily from Wikipedia sources.</p>
  </footer>

  <script src="assets/common.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>
